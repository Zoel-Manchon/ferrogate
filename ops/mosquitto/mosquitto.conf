listener 8883
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key

# Sin certificado cliente no se entra. No hay listener en claro.
require_certificate true

# El CN del certificado pasa a ser el username, y las ACL se escriben
# contra el. La identidad viene de la PKI, no de una contrasena.
use_identity_as_username true

tls_version tlsv1.2
allow_anonymous false

acl_file /mosquitto/config/acl
log_type all
