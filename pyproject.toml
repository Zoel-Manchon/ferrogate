[project]
name = "ferrogate"
version = "0.1.0"
description = "Plataforma multi-tenant de telemetria industrial con gateway edge Modbus/OPC-UA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "aiomqtt>=2.3",
    "influxdb-client>=1.47",
    "pymodbus>=3.7",
    "asyncua>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3", "pytest-cov>=5.0", "pytest-asyncio>=0.24",
    "testcontainers>=4.8", "ruff>=0.6", "mypy>=1.11",
    "import-linter>=2.1", "bandit[toml]>=1.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# S101 (assert) permitido solo en tests
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
strict = true
packages = ["ferrogate"]

[tool.bandit]
exclude_dirs = ["tests", "simulators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere docker"]
